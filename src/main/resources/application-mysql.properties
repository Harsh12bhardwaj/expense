# Production & Local MySQL Configuration
spring.datasource.url=${MYSQL_URL:${DATABASE_URL:${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/expense_tracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}}}
spring.datasource.username=${MYSQL_USER:${DB_USERNAME:root}}
spring.datasource.password=${MYSQL_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
