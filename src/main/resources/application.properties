server.port=${PORT:8080}

# Application Name
spring.application.name=Expense-Tracker

# Active profile: default profile can be overridden via SPRING_PROFILES_ACTIVE
# Defaults to h2 for zero-config immediate cloud deployment (e.g. Render/Railway free tier)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# Common JPA Settings
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Jackson JSON Settings
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.locale=en_IN
